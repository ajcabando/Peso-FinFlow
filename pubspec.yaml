name: finflow
description: "FinFlow — Know where every peso goes. A local-first, offline-first personal finance platform."
publish_to: 'none'
version: 0.1.0+6

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  cupertino_icons: ^1.0.9
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  file_saver: ^0.4.0
  file_selector: ^1.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_slidable: ^4.0.0
  go_router: ^17.3.0
  intl: ^0.20.2
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

